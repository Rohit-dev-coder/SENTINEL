global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Metrics are served on dedicated management ports that are not published to the host;
# Prometheus reaches them over the internal compose network.
scrape_configs:
  - job_name: 'sentinel-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['sentinel-gateway:9080']
        labels:
          service: 'gateway'

  - job_name: 'sentinel-admin'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['sentinel-admin:9081']
        labels:
          service: 'admin'
