spring:
  application:
    name: sentinel-admin
  profiles:
    active: default
  
  datasource:
    url: jdbc:postgresql://localhost:5432/sentinel
    username: sentinel
    password: ${DB_PASSWORD:sentinel123}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    
  flyway:
    enabled: true
    locations: classpath:db/migration
    
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

server:
  port: 8081
  shutdown: graceful

sentinel:
  admin:
    auth:
      enabled: true
      # Required: shared key clients must send in the X-Admin-Key header
      api-key: ${ADMIN_API_KEY:}

management:
  server:
    # Actuator on its own port so metrics are never reachable through the public API port
    port: 9081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.sentinel.admin: INFO

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false