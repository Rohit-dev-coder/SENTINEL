spring:
  application:
    name: sentinel-gateway
  cloud:
    gateway:
      routes:
        # Route to Sample Service 1
        - id: sample-service-1-users
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=0
        
        - id: sample-service-1-products
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/products/**
          filters:
            - StripPrefix=0
        
        - id: sample-service-1-orders
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - StripPrefix=0
        
        # Route to Sample Service 2
        - id: sample-service-2-analytics
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/analytics/**
          filters:
            - StripPrefix=0
        
        - id: sample-service-2-reports
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/reports/**
          filters:
            - StripPrefix=0
        
        - id: sample-service-2-dashboard
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/dashboard/**
          filters:
            - StripPrefix=0

jwt:
  secret: mySecretKeyForSentinelGatewayThatIsLongEnoughForHS256
  expiration: 86400000

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.sentinel.gateway: DEBUG