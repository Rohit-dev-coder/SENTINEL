spring:
  application:
    name: sentinel-gateway
  cloud:
    gateway:
      routes:
        # Route to Sample Service 1
        - id: sample-service-1-users
          uri: ${SAMPLE_SERVICE_1_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=0
            - JwtAuthentication
            - RateLimit
            - name: CircuitBreaker
              args:
                name: sampleService1
                fallbackUri: forward:/fallback/service-unavailable
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
        
        - id: sample-service-1-products
          uri: ${SAMPLE_SERVICE_1_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/products/**
          filters:
            - StripPrefix=0
            - JwtAuthentication
            - RateLimit
            - name: CircuitBreaker
              args:
                name: sampleService1
                fallbackUri: forward:/fallback/service-unavailable
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
        
        - id: sample-service-1-orders
          uri: ${SAMPLE_SERVICE_1_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - StripPrefix=0
            - JwtAuthentication
            - RateLimit
            - name: CircuitBreaker
              args:
                name: sampleService1
                fallbackUri: forward:/fallback/service-unavailable
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
        
        # Route to Sample Service 2
        - id: sample-service-2-analytics
          uri: ${SAMPLE_SERVICE_2_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/analytics/**
          filters:
            - StripPrefix=0
            - JwtAuthentication
            - RateLimit
            - name: CircuitBreaker
              args:
                name: sampleService2
                fallbackUri: forward:/fallback/service-unavailable
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
        
        - id: sample-service-2-reports
          uri: ${SAMPLE_SERVICE_2_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/reports/**
          filters:
            - StripPrefix=0
            - JwtAuthentication
            - RateLimit
            - name: CircuitBreaker
              args:
                name: sampleService2
                fallbackUri: forward:/fallback/service-unavailable
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
        
        - id: sample-service-2-dashboard
          uri: ${SAMPLE_SERVICE_2_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/dashboard/**
          filters:
            - StripPrefix=0
            - JwtAuthentication
            - RateLimit
            - name: CircuitBreaker
              args:
                name: sampleService2
                fallbackUri: forward:/fallback/service-unavailable
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2

jwt:
  # Required: set JWT_SECRET (at least 32 bytes)
  secret: ${JWT_SECRET:}
  expiration: 86400000

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      sampleService1:
        baseConfig: default
      sampleService2:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      sampleService1:
        baseConfig: default
      sampleService2:
        baseConfig: default

management:
  server:
    # Actuator on its own port so metrics are never reachable through the public gateway port
    port: 9080
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

sentinel:
  admin:
    url: ${ADMIN_URL:http://localhost:8081}
    api-key: ${ADMIN_API_KEY:}
    cache-ttl-seconds: 30

server:
  port: 8080
  shutdown: graceful

logging:
  level:
    com.sentinel.gateway: INFO