<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="30" y="30" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">SENTINEL at a glance</text>
<rect x="30" y="70" width="150" height="56" rx="8" fill="#f4f5f7" stroke="#9aa3af" stroke-width="1.5"/><text x="105.0" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Operator</text><text x="105.0" y="112" text-anchor="middle" font-size="12" fill="#4b5563">uses a web browser</text>
<rect x="240" y="70" width="190" height="70" rx="8" fill="#e4edfb" stroke="#3b6fd4" stroke-width="1.5"/><text x="335.0" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">sentinel-ui  :3000</text><text x="335.0" y="112" text-anchor="middle" font-size="12" fill="#4b5563">Next.js dashboard</text><text x="335.0" y="128" text-anchor="middle" font-size="12" fill="#4b5563">login + server-side proxy</text>
<rect x="500" y="70" width="200" height="70" rx="8" fill="#e4edfb" stroke="#3b6fd4" stroke-width="1.5"/><text x="600.0" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">sentinel-admin  :8081</text><text x="600.0" y="112" text-anchor="middle" font-size="12" fill="#4b5563">tenants, tiers, rules</text><text x="600.0" y="128" text-anchor="middle" font-size="12" fill="#4b5563">REST API (needs X-Admin-Key)</text>
<rect x="780" y="70" width="150" height="70" rx="8" fill="#f4f5f7" stroke="#9aa3af" stroke-width="1.5"/><text x="855.0" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">PostgreSQL</text><text x="855.0" y="112" text-anchor="middle" font-size="12" fill="#4b5563">durable config</text><text x="855.0" y="128" text-anchor="middle" font-size="12" fill="#4b5563">tenants + rules</text>
<rect x="30" y="270" width="150" height="56" rx="8" fill="#f4f5f7" stroke="#9aa3af" stroke-width="1.5"/><text x="105.0" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">API client</text><text x="105.0" y="312" text-anchor="middle" font-size="12" fill="#4b5563">a customer app</text>
<rect x="240" y="230" width="260" height="150" rx="8" fill="#e4edfb" stroke="#3b6fd4" stroke-width="1.5"/><text x="370.0" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">sentinel-gateway  :8080</text><text x="370.0" y="272" text-anchor="middle" font-size="12" fill="#4b5563">1  Request ID</text><text x="370.0" y="288" text-anchor="middle" font-size="12" fill="#4b5563">2  JWT check</text><text x="370.0" y="304" text-anchor="middle" font-size="12" fill="#4b5563">3  Rate limit (tier / rules)</text><text x="370.0" y="320" text-anchor="middle" font-size="12" fill="#4b5563">4  Circuit breaker + retry</text><text x="370.0" y="336" text-anchor="middle" font-size="12" fill="#4b5563">5  Forward to service</text>
<rect x="600" y="270" width="150" height="56" rx="8" fill="#f4f5f7" stroke="#9aa3af" stroke-width="1.5"/><text x="675.0" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Redis  :6379</text><text x="675.0" y="312" text-anchor="middle" font-size="12" fill="#4b5563">counters + cache</text>
<rect x="240" y="450" width="260" height="64" rx="8" fill="#f4f5f7" stroke="#9aa3af" stroke-width="1.5"/><text x="370.0" y="472" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">sample-service-1 / -2</text><text x="370.0" y="492" text-anchor="middle" font-size="12" fill="#4b5563">:8082  :8083   (stand-in backends)</text>
<rect x="640" y="440" width="290" height="74" rx="8" fill="#fdf3dc" stroke="#c58b1a" stroke-width="1.5"/><text x="785.0" y="462" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Prometheus :9090 / Grafana :3001</text><text x="785.0" y="482" text-anchor="middle" font-size="12" fill="#4b5563">metrics from :9080 and :9081</text><text x="785.0" y="498" text-anchor="middle" font-size="12" fill="#4b5563">(internal network only)</text>
<line x1="180" y1="98" x2="240" y2="98" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/><text x="210" y="90" text-anchor="middle" font-size="11.5" fill="#374151" paint-order="stroke" stroke="#fff" stroke-width="4">HTTPS</text>
<line x1="430" y1="105" x2="500" y2="105" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/><text x="465" y="96" text-anchor="middle" font-size="11.5" fill="#374151" paint-order="stroke" stroke="#fff" stroke-width="4">key</text>
<line x1="700" y1="105" x2="780" y2="105" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/><text x="740" y="96" text-anchor="middle" font-size="11.5" fill="#374151" paint-order="stroke" stroke="#fff" stroke-width="4">JDBC</text>
<line x1="180" y1="298" x2="240" y2="298" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/><text x="210" y="290" text-anchor="middle" font-size="11.5" fill="#374151" paint-order="stroke" stroke="#fff" stroke-width="4">JWT</text>
<line x1="430" y1="230" x2="540" y2="140" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/><text x="400" y="190" text-anchor="middle" font-size="11.5" fill="#374151" paint-order="stroke" stroke="#fff" stroke-width="4">tenant config</text>
<line x1="500" y1="298" x2="600" y2="298" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/><text x="550" y="290" text-anchor="middle" font-size="11.5" fill="#374151" paint-order="stroke" stroke="#fff" stroke-width="4">Lua scripts</text>
<line x1="370" y1="380" x2="370" y2="450" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/><text x="380" y="420" text-anchor="start" font-size="11.5" fill="#374151" paint-order="stroke" stroke="#fff" stroke-width="4">proxied request</text>
<line x1="640" y1="470" x2="500" y2="350" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="600" y="400" text-anchor="middle" font-size="11.5" fill="#374151" paint-order="stroke" stroke="#fff" stroke-width="4">scrape</text>
<line x1="650" y1="140" x2="660" y2="270" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="670" y="215" text-anchor="start" font-size="11.5" fill="#374151" paint-order="stroke" stroke="#fff" stroke-width="4">admin cache</text>
</svg>