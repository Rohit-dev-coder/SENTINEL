<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect width="960" height="420" fill="#ffffff"/>
<text x="30" y="30" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">Two kinds of keys, two doors</text>
<text x="30" y="70" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Door A: customers calling APIs</text>
<rect x="30" y="86" width="150" height="60" rx="8" fill="#f4f5f7" stroke="#9aa3af" stroke-width="1.5"/><text x="105.0" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Customer app</text><text x="105.0" y="128" text-anchor="middle" font-size="12" fill="#4b5563">holds tenant API key</text>
<rect x="260" y="86" width="180" height="60" rx="8" fill="#e4edfb" stroke="#3b6fd4" stroke-width="1.5"/><text x="350.0" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">POST /auth/token</text><text x="350.0" y="128" text-anchor="middle" font-size="12" fill="#4b5563">header X-Tenant-Api-Key</text>
<rect x="520" y="86" width="170" height="60" rx="8" fill="#e4edfb" stroke="#3b6fd4" stroke-width="1.5"/><text x="605.0" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">sentinel-admin</text><text x="605.0" y="128" text-anchor="middle" font-size="12" fill="#4b5563">is this key active?</text>
<rect x="770" y="86" width="160" height="60" rx="8" fill="#f4f5f7" stroke="#9aa3af" stroke-width="1.5"/><text x="850.0" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">JWT (24 h)</text><text x="850.0" y="128" text-anchor="middle" font-size="12" fill="#4b5563">subject = API key</text>
<line x1="180" y1="116" x2="260" y2="116" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="440" y1="116" x2="520" y2="116" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/><text x="480" y="108" text-anchor="middle" font-size="11.5" fill="#374151" paint-order="stroke" stroke="#fff" stroke-width="4">checked live</text>
<line x1="690" y1="116" x2="770" y2="116" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/><text x="730" y="108" text-anchor="middle" font-size="11.5" fill="#374151" paint-order="stroke" stroke="#fff" stroke-width="4">yes: sign</text>
<text x="30" y="200" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Door B: operators managing config</text>
<rect x="30" y="216" width="150" height="60" rx="8" fill="#f4f5f7" stroke="#9aa3af" stroke-width="1.5"/><text x="105.0" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Operator</text><text x="105.0" y="258" text-anchor="middle" font-size="12" fill="#4b5563">username + password</text>
<rect x="260" y="216" width="180" height="60" rx="8" fill="#e4edfb" stroke="#3b6fd4" stroke-width="1.5"/><text x="350.0" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">sentinel-ui</text><text x="350.0" y="258" text-anchor="middle" font-size="12" fill="#4b5563">signed cookie, 8 h</text>
<rect x="520" y="216" width="170" height="60" rx="8" fill="#e4edfb" stroke="#3b6fd4" stroke-width="1.5"/><text x="605.0" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">UI server proxy</text><text x="605.0" y="258" text-anchor="middle" font-size="12" fill="#4b5563">adds X-Admin-Key</text>
<rect x="770" y="216" width="160" height="60" rx="8" fill="#f4f5f7" stroke="#9aa3af" stroke-width="1.5"/><text x="850.0" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">sentinel-admin</text><text x="850.0" y="258" text-anchor="middle" font-size="12" fill="#4b5563">tenants + rules</text>
<line x1="180" y1="246" x2="260" y2="246" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="440" y1="246" x2="520" y2="246" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/><text x="480" y="238" text-anchor="middle" font-size="11.5" fill="#374151" paint-order="stroke" stroke="#fff" stroke-width="4">cookie checked</text>
<line x1="690" y1="246" x2="770" y2="246" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/><text x="730" y="238" text-anchor="middle" font-size="11.5" fill="#374151" paint-order="stroke" stroke="#fff" stroke-width="4">server-side</text>
<rect x="30" y="320" width="900" height="70" rx="8" fill="#fdf3dc" stroke="#c58b1a" stroke-width="1.5"/><text x="480.0" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Rules of the road</text><text x="480.0" y="362" text-anchor="middle" font-size="12" fill="#4b5563">The admin key never reaches a browser.  JWT_SECRET must be 32+ bytes or the gateway refuses to start.</text><text x="480.0" y="378" text-anchor="middle" font-size="12" fill="#4b5563">The gateway strips any X-API-Key a client sends and sets it from the verified token.</text>
</svg>