<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect width="960" height="480" fill="#ffffff"/>
<text x="30" y="30" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">Life of one API request</text>
<rect x="30" y="60" width="560" height="52" rx="8" fill="#f4f5f7" stroke="#9aa3af" stroke-width="1.5"/><circle cx="62" cy="86" r="14" fill="#ffffff" stroke="#9aa3af" stroke-width="1.5"/><text x="62" y="91" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">1</text>
<text x="90" y="82" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Client calls the gateway</text>
<text x="90" y="101" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">GET /api/v1/orders/42 with  Authorization: Bearer (your JWT)</text>
<line x1="310" y1="112" x2="310" y2="128" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="30" y="128" width="560" height="52" rx="8" fill="#f4f5f7" stroke="#9aa3af" stroke-width="1.5"/><circle cx="62" cy="154" r="14" fill="#ffffff" stroke="#9aa3af" stroke-width="1.5"/><text x="62" y="159" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">2</text>
<text x="90" y="150" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Request ID</text>
<text x="90" y="169" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">keep a safe X-Request-Id from the client, otherwise create one</text>
<line x1="310" y1="180" x2="310" y2="196" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="30" y="196" width="560" height="52" rx="8" fill="#e4edfb" stroke="#3b6fd4" stroke-width="1.5"/><circle cx="62" cy="222" r="14" fill="#ffffff" stroke="#3b6fd4" stroke-width="1.5"/><text x="62" y="227" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">3</text>
<text x="90" y="218" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">JWT check</text>
<text x="90" y="237" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">verify signature and expiry; drop any client X-API-Key, set it from the token</text>
<line x1="310" y1="248" x2="310" y2="264" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="30" y="264" width="560" height="52" rx="8" fill="#e4edfb" stroke="#3b6fd4" stroke-width="1.5"/><circle cx="62" cy="290" r="14" fill="#ffffff" stroke="#3b6fd4" stroke-width="1.5"/><text x="62" y="295" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">4</text>
<text x="90" y="286" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Rate limit</text>
<text x="90" y="305" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">ask admin for tier + rules (cached 30 s), run the Lua script in Redis</text>
<line x1="310" y1="316" x2="310" y2="332" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="30" y="332" width="560" height="52" rx="8" fill="#f4f5f7" stroke="#9aa3af" stroke-width="1.5"/><circle cx="62" cy="358" r="14" fill="#ffffff" stroke="#9aa3af" stroke-width="1.5"/><text x="62" y="363" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">5</text>
<text x="90" y="354" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Circuit breaker + retry</text>
<text x="90" y="373" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">skip a failing service; retry GET twice on 502 / 503</text>
<line x1="310" y1="384" x2="310" y2="400" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="30" y="400" width="560" height="52" rx="8" fill="#f4f5f7" stroke="#9aa3af" stroke-width="1.5"/><circle cx="62" cy="426" r="14" fill="#ffffff" stroke="#9aa3af" stroke-width="1.5"/><text x="62" y="431" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">6</text>
<text x="90" y="422" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Backend answers</text>
<text x="90" y="441" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">response returns with X-RateLimit-* and X-Request-Id headers</text>
<text x="640" y="76" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">What can stop the request</text>
<rect x="640" y="96" width="52" height="26" rx="5" fill="#fdf3dc" stroke="#c58b1a"/><text x="666" y="114" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">401</text>
<text x="704" y="114" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">missing, expired or forged JWT</text>
<rect x="640" y="136" width="52" height="26" rx="5" fill="#fdf3dc" stroke="#c58b1a"/><text x="666" y="154" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">403</text>
<text x="704" y="154" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">tenant unknown or deactivated</text>
<rect x="640" y="176" width="52" height="26" rx="5" fill="#fdf3dc" stroke="#c58b1a"/><text x="666" y="194" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">429</text>
<text x="704" y="194" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">limit reached, try again later</text>
<rect x="640" y="216" width="52" height="26" rx="5" fill="#fdf3dc" stroke="#c58b1a"/><text x="666" y="234" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">503</text>
<text x="704" y="234" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">backend failing, breaker open</text>
</svg>