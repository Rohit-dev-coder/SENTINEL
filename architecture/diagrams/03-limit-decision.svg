<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect width="960" height="500" fill="#ffffff"/>
<text x="30" y="30" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">How the gateway picks a limit</text>
<rect x="30" y="70" width="170" height="64" rx="8" fill="#f4f5f7" stroke="#9aa3af" stroke-width="1.5"/><text x="115.0" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Request arrives</text><text x="115.0" y="112" text-anchor="middle" font-size="12" fill="#4b5563">tenant key + path</text>
<rect x="260" y="70" width="190" height="64" rx="8" fill="#e4edfb" stroke="#3b6fd4" stroke-width="1.5"/><text x="355.0" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Look up tenant</text><text x="355.0" y="112" text-anchor="middle" font-size="12" fill="#4b5563">cache 30 s, else ask admin</text>
<rect x="510" y="40" width="190" height="56" rx="8" fill="#fdf3dc" stroke="#c58b1a" stroke-width="1.5"/><text x="605.0" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Unknown or inactive</text><text x="605.0" y="82" text-anchor="middle" font-size="12" fill="#4b5563">reply 403</text>
<rect x="510" y="120" width="190" height="64" rx="8" fill="#e4edfb" stroke="#3b6fd4" stroke-width="1.5"/><text x="605.0" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Rules for this path?</text><text x="605.0" y="162" text-anchor="middle" font-size="12" fill="#4b5563">Ant pattern, first match</text>
<rect x="260" y="250" width="210" height="86" rx="8" fill="#f4f5f7" stroke="#9aa3af" stroke-width="1.5"/><text x="365.0" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Use the rule</text><text x="365.0" y="292" text-anchor="middle" font-size="12" fill="#4b5563">its algorithm, max requests,</text><text x="365.0" y="308" text-anchor="middle" font-size="12" fill="#4b5563">window seconds</text>
<rect x="540" y="250" width="210" height="86" rx="8" fill="#f4f5f7" stroke="#9aa3af" stroke-width="1.5"/><text x="645.0" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Use the tier default</text><text x="645.0" y="292" text-anchor="middle" font-size="12" fill="#4b5563">token bucket with the tier limit</text><text x="645.0" y="308" text-anchor="middle" font-size="12" fill="#4b5563">FREE 10  BASIC 100  PREMIUM 1000</text><text x="645.0" y="324" text-anchor="middle" font-size="12" fill="#4b5563">ENTERPRISE 10000 per minute</text>
<rect x="380" y="390" width="200" height="56" rx="8" fill="#e4edfb" stroke="#3b6fd4" stroke-width="1.5"/><text x="480.0" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Run Lua in Redis</text><text x="480.0" y="432" text-anchor="middle" font-size="12" fill="#4b5563">allowed? remaining? reset?</text>
<line x1="200" y1="102" x2="260" y2="102" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="450" y1="92" x2="510" y2="70" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/><text x="490" y="66" text-anchor="middle" font-size="11.5" fill="#374151" paint-order="stroke" stroke="#fff" stroke-width="4">no</text>
<line x1="450" y1="112" x2="510" y2="148" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/><text x="476" y="140" text-anchor="middle" font-size="11.5" fill="#374151" paint-order="stroke" stroke="#fff" stroke-width="4">yes</text>
<line x1="560" y1="184" x2="400" y2="250" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/><text x="450" y="204" text-anchor="middle" font-size="11.5" fill="#374151" paint-order="stroke" stroke="#fff" stroke-width="4">match</text>
<line x1="640" y1="184" x2="640" y2="250" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/><text x="650" y="224" text-anchor="start" font-size="11.5" fill="#374151" paint-order="stroke" stroke="#fff" stroke-width="4">no match</text>
<line x1="365" y1="336" x2="450" y2="390" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="645" y1="336" x2="520" y2="390" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="30" y="480" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">If the admin service is down: use the last known config, or FREE limits if nothing is cached. If Redis is down: allow the request and log an error.</text>
</svg>